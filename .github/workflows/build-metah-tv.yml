
name: Build MetaH TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get complete OpenTV source
        run: git clone --depth 1 https://github.com/opentvproject/opentv.git source

      - name: Set MetaH TV branding
        run: |
          sed -i 's/<string name="app_name">OpenTV<\/string>/<string name="app_name">MetaH TV<\/string>/' source/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "app.opentv"/applicationId = "app.metah.tv"/' source/app/build.gradle.kts

      - name: Build APK
        run: cd source && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaH-TV-APK
          path: source/app/build/outputs/apk/debug/*.apk
